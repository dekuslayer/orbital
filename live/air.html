<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Information Jukebox - Live Atmosphere</title>
<link rel="stylesheet" href="live.css">
</head>
<body style="--accent:#00bfa5;--btn:#00796b;--btn-hover:#004d40">
<div class="container">
  <h1>Earth Information Jukebox</h1>
  <p class="sub">Live Sonification of Surface Solar Irradiance over Cairo (NASA POWER; not a direct air-quality or aerosol measurement)</p>
  <canvas id="visualizer"></canvas>
  <div id="narrative-box" class="narrative-box" aria-live="polite">Connecting to NASA POWER surface-solar-irradiance data...</div>
  <div class="btn-group">
    <button onclick="sonifyAirQuality(false)">Sonify Latest Reading</button>
    <button onclick="sonifyAirQuality(true)">Sonify 7-Day Irradiance Sequence</button>
  </div>
  <div id="status-msg" class="status">Connecting to the named NASA API…</div>
</div>
<script src="common.js"></script>
<script>
mountNav('air'); strokeColor = '#00bfa5';

let atmosphericValues = [3.1, 3.6, 4.0, 4.4, 4.8, 5.1]; // sample values (kWh/m²/day), used only if NASA is unreachable
let irradianceDataIsLive = false;

async function fetchNASAAtmosphereData() {
  try {
    const json = await getJSON(powerUrl('ALLSKY_SFC_SW_DWN', 31.23, 30.04, powerWindow()));
    const v = validValues(json.properties.parameter.ALLSKY_SFC_SW_DWN);
    if (v.length) {
      atmosphericValues = v; irradianceDataIsLive = true;
      setStatus('NASA API CONNECTED: ' + v.length + ' daily readings (latest ' + v[v.length - 1] + ' kWh/m²/day)');
      setNarrative('NASA POWER ALLSKY_SFC_SW_DWN daily surface solar-irradiance values loaded for the Cairo grid point. Cloud, dust and haze can affect sunlight reaching the surface, but this variable is not aerosol optical depth or a direct air-quality measurement.');
    } else throw new Error('No valid ALLSKY_SFC_SW_DWN values in NASA POWER response');
  } catch (e) { setStatus('OFFLINE FALLBACK MODE: sample values in use, NOT live NASA data.'); setNarrative('NASA POWER could not be reached or returned usable values. The displayed irradiance values are samples, not live observations.'); } finally { setLiveControlsReady(true); }
}
fetchNASAAtmosphereData();

const airFreq = v => Math.round(200 + v * 80);   // kWh/m²/day → Hz (a typical 3–8 range maps to ~440–840 Hz)
function sonifyAirQuality(isSequence) {
  initAudio();
  const latest = atmosphericValues[atmosphericValues.length - 1];
  if (isSequence) {
    strokeColor = '#ff5252';
    const text = irradianceDataIsLive ? ('Sonifying ' + atmosphericValues.length + ' NASA POWER daily surface solar-irradiance readings for Cairo. Higher pitch means more sunlight reaching the ground.') : ('Sonifying ' + atmosphericValues.length + ' illustrative offline solar-irradiance samples. These are not live NASA measurements.');
    setNarrative(text); speakText(text);
    let t = audioCtx.currentTime;
    atmosphericValues.forEach(v => { note('square', airFreq(v), t, 0.18, 0.5); t += 0.28; });
  } else {
    strokeColor = '#00bfa5';
    const text = (irradianceDataIsLive ? 'Latest NASA POWER surface solar-irradiance reading: ' : 'Illustrative offline sample: ') + latest + ' kWh per square metre per day, mapped to ' + airFreq(latest) + ' Hz. ' + (irradianceDataIsLive ? 'This is not aerosol optical thickness or an air-quality measurement.' : 'This is not a live NASA observation.');
    setNarrative(text); speakText(text);
    note('sine', airFreq(latest), audioCtx.currentTime, 3.0, 0.75);
  }
}
</script>
</body>
</html>
